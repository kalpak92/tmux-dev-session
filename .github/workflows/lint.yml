name: Lint

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Show tool versions
        run: |
          bash --version
          shellcheck --version
      - name: Check Bash syntax
        run: |
          find . -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
      - name: Lint shell scripts
        run: shellcheck --severity=warning install.sh uninstall.sh scripts/*.sh shell/*.sh
